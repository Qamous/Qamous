name: CI

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run
      - run: npm run build
      - run: npx tsc -p cloudflare/tsconfig.json
      # Production release remains a local, authenticated Cloudflare deployment.
      # Never reconstruct Firebase secrets or redeploy the retired Vercel app.
